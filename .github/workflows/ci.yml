name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify = Spotless check, tests (incl. Spring Boot 3 compatibility), 100% coverage gate on core and jakarta
      - name: Build and test
        run: ./mvnw -B -ntp verify javadoc:javadoc

      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        uses: codecov/codecov-action@v5
        with:
          files: tr-validation-core/target/site/jacoco/jacoco.xml,tr-validation-jakarta/target/site/jacoco/jacoco.xml,tr-validation-spring-boot-starter/target/site/jacoco/jacoco.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          retention-days: 14
